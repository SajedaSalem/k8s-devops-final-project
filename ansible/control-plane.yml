
- name: Initialize Kubernetes control plane
  hosts: k8s_master
  become: true

  tasks:
    - name: Initialize control plane with kubeadm
      ansible.builtin.command:
        cmd: >
          kubeadm init
          --apiserver-advertise-address={{ cp1_ip }}
          --pod-network-cidr={{ pod_network_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kube directory for cluster user
      ansible.builtin.file:
        path: "/home/{{ cluster_user }}/.kube"
        state: directory
        owner: "{{ cluster_user }}"
        group: "{{ cluster_user }}"
        mode: '0755'

    - name: Copy kubeconfig for cluster user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ cluster_user }}/.kube/config"
        remote_src: true
        owner: "{{ cluster_user }}"
        group: "{{ cluster_user }}"
        mode: '0600'

    - name: Install Calico v3.31.0
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.0/manifests/calico.yaml
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      register: calico_apply
      changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"

    - name: Configure Calico IP pool for Azure VXLAN
      ansible.builtin.command:
        cmd: >
          kubectl patch ippool default-ipv4-ippool
          --type=merge
          -p '{"spec":{"ipipMode":"Never","vxlanMode":"Always"}}'
      environment:
        KUBECONFIG: /home/{{ cluster_user }}/.kube/config
      register: calico_vxlan
      changed_when: "'patched' in calico_vxlan.stdout"
    
    - name: Generate Kubernetes worker join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: join_command
      changed_when: false
