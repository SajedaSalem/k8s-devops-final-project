name: Build AzureRM Provider

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone AzureRM provider
        run: |
          git clone --branch v4.81.0 --depth 1 \
            https://github.com/hashicorp/terraform-provider-azurerm.git

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Build provider
        run: |
          cd terraform-provider-azurerm
          CGO_ENABLED=0 go build \
            -o terraform-provider-azurerm_v4.81.0

      - name: Upload provider
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-azurerm-v4.81.0-linux-amd64
          path: terraform-provider-azurerm/terraform-provider-azurerm_v4.81.0